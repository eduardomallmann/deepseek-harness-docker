name: Publish image

on:
  push:
    branches: [main]
    paths: [VERSION, Dockerfile, entrypoint.sh, "profile/**", .github/workflows/publish.yml]
  workflow_dispatch:
    inputs:
      version:
        description: "@deepseek-ai/dsh version (defaults to the VERSION file)"
        required: false
        type: string
      latest:
        description: "Also move the :latest tag"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Docker Hub is published only when this repository variable is set.
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and image names
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${INPUT_VERSION:-$(tr -d '[:space:]' < VERSION)}"
          images="ghcr.io/${OWNER,,}/deepseek-harness"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="$images docker.io/${DOCKERHUB_USERNAME}/deepseek-harness"
          fi
          tags=""
          for image in $images; do
            tags="${tags}${image}:${version},"
            if [ "${INPUT_LATEST:-true}" != "false" ]; then
              tags="${tags}${image}:latest,"
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=${tags%,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DSH_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
